# ===================================================================
# Configurações de Teste - Testcontainers MySQL
# ===================================================================

# Dev Services - NÃO usar Dev Services, vamos configurar manualmente
quarkus.datasource.devservices.enabled=false

# Datasource - Configuração básica (será sobrescrita pelo Testcontainer)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=test
quarkus.datasource.password=test

# Hibernate - Drop e recria o schema a cada execução de teste
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file

# HTTP - Porta aleatória para evitar conflitos
quarkus.http.test-port=0

# Desabilitar telemetria durante os testes
quarkus.otel.sdk.disabled=true

# Logs - Reduzir verbosidade
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.testcontainers".level=INFO

# Configurações específicas do MySQL para testes
quarkus.datasource.jdbc.additional-jdbc-properties.useSSL=false
quarkus.datasource.jdbc.additional-jdbc-properties.serverTimezone=UTC
quarkus.datasource.jdbc.additional-jdbc-properties.allowPublicKeyRetrieval=true
